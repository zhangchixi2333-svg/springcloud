server:
  port: 9002

spring:
  boot:
    admin:
      client:
        url: http://localhost:7779
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
feign:
  circuitbreaker:
    enabled: true
application:
    name: zcxshop-web
  zipkin:
    base-url: http://localhost:9042
    sender:
      type: web
  sleuth:
    sampler:
      probability: 1

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8888/eureka
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ========== 自定义业务配置 ==========
web:
  version: 1.0.0
  app-name: "在线商城"
  service-phone: "400-xxx-xxxx"
  show-user-module: true

# ========== 暴露 Actuator 端点（包含 Spring Boot Admin 所需的 health） ==========
management:
  endpoints:
    web:
      exposure:
        include: bus-refresh,health,info
       
