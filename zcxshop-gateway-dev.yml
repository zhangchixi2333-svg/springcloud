server:
  port: 8222

spring:
  cloud:
    gateway:
      routes:
        - id: zcxshop-user
          uri: lb://zcxshop-user
          predicates:
            - Path=/zcxshop-user/**
          filters:
            - StripPrefix=1
        - id: zcxshop-web
          uri: lb://zcxshop-web
          predicates:
            - Path=/zcxshop-web/**
          filters:
            - StripPrefix=1
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8888/eureka
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    urls:
      - name: zcxshop-user
        url: /zcxshop-user/v3/api-docs
      - name: zcxshop-web
        url: /zcxshop-web/v3/api-docs

# ========== 自定义业务配置 ==========
gateway:
  auth-enabled: true
  error-filter-enabled: true
  auth-whitelist:
    - /v3/api-docs
    - /swagger-ui
    - /swagger-ui.html
    - /webjars
    - /swagger-resources
    - /favicon.ico

# ========== 暴露 Bus 刷新端点 ==========
management:
  endpoints:
    web:
      exposure:
        include: bus-refresh
