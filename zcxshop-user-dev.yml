server:
  port: 9101

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/zcxspringcloud?characterEncoding=UTF8&useSSL=false
    username: root
    password: 123456
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    generate-ddl: true
    database: mysql
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8888/eureka
  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ========== 自定义业务配置 ==========
user:
  registration-enabled: true
  default-page-size: 10
  avatar-max-size: 5242880
  version: 1.0.0

# ========== 暴露 Bus 刷新端点 ==========
management:
  endpoints:
    web:
      exposure:
        include: bus-refresh
